<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url("../../app/assets/fonts/Anton-Regular.ttf"); }
:root { --red: #E5322D; --orange: #FF6B2C; --ink: #0B0B0D; --muted: #B9B9C2; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: Anton, sans-serif; color: #fff; text-align: center; position: relative; }
body.base { background: radial-gradient(900px 900px at 50% 36%, rgba(229,50,45,.55), rgba(229,50,45,0) 70%), var(--ink); }
body.pill { background: transparent; }
.icon { position: absolute; left: 50%; top: 400px; width: 380px; height: 380px; transform: translateX(-50%);
  border-radius: 86px; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08); }
.icon img { width: 100%; height: 100%; display: block; }
.name { position: absolute; left: 0; right: 0; top: 830px; font-size: 200px; line-height: 1; letter-spacing: 2px; }
.tag { position: absolute; left: 60px; right: 60px; top: 1075px; font-size: 62px; line-height: 1.12; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.cta { position: absolute; left: 50%; top: 1330px; transform: translateX(-50%); padding: 26px 70px 30px;
  border-radius: 999px; background: linear-gradient(90deg, var(--red), var(--orange)); font-size: 66px; line-height: 1;
  white-space: nowrap; box-shadow: 0 18px 50px rgba(229,50,45,.45); }
.store { position: absolute; left: 0; right: 0; top: 1505px; font-size: 48px; letter-spacing: 6px; color: var(--muted); }
</style></head>
<body class="MODE">
  <div class="layer-base">
    <div class="icon"><img src="../../app/assets/brand/icon.png" alt=""></div>
    <div class="name">FaceRep</div>
    <div class="tag">Train your face like<br>you train your body</div>
  </div>
  <div class="layer-pill">
    <div class="cta">Available on the App Store</div>
    <div class="store">SEARCH “FACEREP”</div>
  </div>
</body></html>
